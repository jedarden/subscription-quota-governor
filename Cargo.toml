[package]
name = "subscription-governor"
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT"
description = "Provider-neutral subscription quota pacing for AI coding agents"
repository = "https://git.ardenone.com/jedarden/subscription-quota-governor"

[[bin]]
name = "subgov"
path = "src/main.rs"

# Scripted stdio JSON-RPC fake for the Codex app-server contract tests
# (plan.md §7.2). Test-only support, not part of the shipped product --
# lives under tests/support/ rather than src/bin/ for that reason.
[[bin]]
name = "fake_codex_app_server"
path = "tests/support/fake_codex_app_server.rs"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.6", features = ["derive"] }
ctrlc = "=3.5.2"
dirs = "=6.0.0"
fs2 = "=0.4.3"
rand = "=0.8.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
thiserror = "=2.0.20"
ureq = { version = "=2.12.1", features = ["json"] }

# Process-group termination for observer/actuator children (plan.md
# §11.1/§11.2). Unix-only, matching every other OS-specific dependency and
# `#[cfg(unix)]` block already in this crate.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"
