version: 1
poll_interval_seconds: 300
state_path: /home/coding/.local/state/subgov/codex.json
# Plan §23: elastic tier over the roster. Observe-only until the staged rollout.
accounts:
  codex:
    source:
      type: codex_app_server
      timeout_seconds: 30
    fleet:
      min_workers: 0
      max_workers: 2
      bootstrap_workers: 1
      max_scale_up_per_cycle: 1
      max_scale_down_per_cycle: 1
      observer:
        type: needle_status
        agent: codex-gpt-5.6-luna-xhigh
        identifier_prefix: sg-codex-
        stale_after_seconds: 60
      actuator:
        type: needle_run
        repo: /home/coding/NEEDLE
        adapter: codex-gpt-5.6-luna-xhigh
        identifier_prefix: sg-codex-
        # Plan §26.5: seed each new worker with the ready workspace that has
        # the fewest running workers, from the WP23 demand state and NEEDLE's
        # heartbeat directory. The demand state exists only while the WP23
        # refresh publishes it; without a readable state scale-up fails
        # closed, and `repo` remains the single seed if these are removed.
        seed_demand_state: /home/coding/.local/state/subgov/codex-productive-demand.json
        seed_heartbeats: /home/coding/.needle/state/heartbeats
    utilization:
      reserve_fraction: 0.15
      strategy: linear_to_reset
      stale_after_seconds: 900
      stale_behavior: hold
      minimum_sample_seconds: 240
