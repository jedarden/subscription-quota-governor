# Codinghome Codex elastic governor; maintained source for ~/.config/subgov/codex.yaml.
# Productive full-speed banked policy enabled under subgov-564a5b9a.
version: 1
poll_interval_seconds: 300
state_path: /home/coding/.local/state/subgov/codex.json
accounts:
  codex:
    source:
      type: normalized_file
      path: /home/coding/.local/state/subgov/codex-productive-snapshot.json
    fleet:
      min_workers: 0
      max_workers: 12
      bootstrap_workers: 1
      max_scale_up_per_cycle: 2
      max_scale_down_per_cycle: 1
      observer:
        type: command
        argv:
        - /run/current-system/sw/bin/systemd-run
        - --user
        - --wait
        - --pipe
        - --collect
        - --quiet
        - --property=NoNewPrivileges=yes
        - --setenv=PATH=/home/coding/.local/bin:/home/coding/.cargo/bin:/run/current-system/sw/bin
        - /run/current-system/sw/bin/python3
        - -B
        - /home/coding/.local/lib/subgov-codex/codex-productive.py
        - --settings
        - /home/coding/.config/subgov/codex-productive.json
        - observe
      actuator:
        type: command
        reconcile_unchanged: true
        argv:
        - /run/current-system/sw/bin/systemd-run
        - --user
        - --wait
        - --pipe
        - --collect
        - --quiet
        - --property=NoNewPrivileges=yes
        - --setenv=PATH=/home/coding/.local/bin:/home/coding/.cargo/bin:/run/current-system/sw/bin
        - /run/current-system/sw/bin/python3
        - -B
        - /home/coding/.local/lib/subgov-codex/codex-productive.py
        - --settings
        - /home/coding/.config/subgov/codex-productive.json
        - actuate
        - '{desired_workers}'
    utilization:
      reserve_fraction: 0.05
      strategy: linear_to_reset
      stale_after_seconds: 900
      stale_behavior: hold
      minimum_sample_seconds: 240
    banked_resets:
      enabled: true
      full_speed: true
      minimum_pace_multiplier: 2.0
      redeem_at_utilization: 1.0
      deadline_safety_seconds: 21600
federation:
  host_id: codinghome
  primary: true
  peers: []
